server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  # `text/javascript` FIRST, because that is what nginx 1.27 actually labels a .js file — the
  # older `application/javascript` alone silently compressed nothing, and the 500kB bundle went
  # out whole. Verified against the deployed URL, not assumed from the config.
  gzip_types text/javascript application/javascript text/css image/svg+xml application/json;
  gzip_min_length 1024;
  # Fly puts a proxy in front, which sets `Via` — and nginx's default `gzip_proxied off` then
  # declines to compress for exactly the requests that need it most.
  gzip_proxied any;

  # Vite fingerprints these filenames, so the content behind a given name can never change —
  # which is exactly the condition `immutable` asks for.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The app uses HASH routing (`/#/scan?i=...`), so a fragment never reaches this server and no
  # SPA fallback is strictly needed — that is why a printed sticker cannot 404 on a missing
  # rewrite rule. `try_files` is here anyway, as the one line that keeps that true if a real
  # path route is ever added.
  #
  # The no-cache header belongs HERE, not in a `location = /index.html`: a phone asks for `/`,
  # which that exact-match block never sees. index.html is what points at the current asset
  # names, so a stale copy sends somebody looking for a build that no longer exists.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
